# Example baseline case: Global Ocean, 2025-01-01
#
# Replace input_dir/input_file with your local AVISO/Copernicus file path before running.
# This case is heavier than the regional cases and should be run after a small case works.

case:
  name: "case_global_20250101"
  date: "20250101"
  region_preset: "global"
  purpose: "Global baseline case for 0/360 boundary and full-domain workflow checks."

input:
  input_dir: "E:/Data/SLA/nc/2025"
  input_file: "dt_global_allsat_phy_l4_20250101.nc"
  file_type: "nc"
  pattern: "*.nc"
  variables:
    sla: "sla"
    u: "ugosa"
    v: "vgosa"
  longitude_convention: "0_360"

output:
  output_root: "baseline_runs"
  legacy_output_dir: "baseline_runs/case_global_20250101/original_output"

region:
  legacy_name: "Global Ocean"
  lon_min: null
  lon_max: null
  lat_min: null
  lat_max: null
  dlon: 0.25
  dlat: 0.25

blocking:
  lon_block: 1
  lat_block: 1
  outer_range: 3.0
  pool_size: 8

filter:
  method: "gaussian_highpass"
  z_kernel: 6
  m_kernel: 6

eddy_detection:
  contour_interval_cm: 0.25
  shape_error: 55
  amplitude_min_cm: 1.0
  amplitude_max_cm: 150.0
  pixel_num_min: 2
  pixel_num_max: 10000

baseline:
  source_json: null
  baseline_records_csv: "baseline_runs/case_global_20250101/baseline_tables/baseline_records.csv"
  baseline_summary_csv: "baseline_runs/case_global_20250101/baseline_tables/baseline_summary.csv"
  match_distance_deg: 0.25
